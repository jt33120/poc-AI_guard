# Registre des lignes de couverture — la seule partie RÉDIGÉE de la carte.
#
# AD-30 : la carte est générée depuis les scénarios qui passent, jamais rédigée.
# Ce fichier ne dit donc pas ce qui est couvert : il dit ce qui est *revendiqué*,
# et le générateur confronte la revendication aux scénarios. L'écart entre les deux
# est CM-7, dont la cible est zéro.
#
# Règle dure : une facette en mode `B` sans scénario qui passe **fait échouer le
# build**. Une revendication « Bloqué » qu'aucun test n'asserte n'est pas une nuance
# de rédaction, c'est une affirmation fausse.
#
# Les autres modes n'exigent pas de scénario — mais s'il en existe un, il est
# enregistré, parce qu'une preuve de plus ne se jette pas.

version: 1

modes:
  B: {libelle: "Bloqué", exige_scenario: true}
  D: {libelle: "Détecté", exige_scenario: false}
  O: {libelle: "Orchestré", exige_scenario: false}
  A: {libelle: "Attesté", exige_scenario: false}
  X: {libelle: "Hors périmètre", exige_scenario: false}

# Chemins d'ingestion (AD-28). Une revendication porte toujours le sien : une ligne
# vraie sur MCP se lirait comme vraie partout si on ne le disait pas.
ingress:
  mcp: "Gateway MCP — contraignant, xSOM exécute ou n'exécute pas"
  http: "/v1/authorize — coopératif, l'agent honore le verdict"
  llm_proxy: "Proxy LLM — egress DLP contraignant ; garde d'outils sous G-25/G-26"

rows:
  - id: M-01
    titre: "Injection de prompts directe"
    famille: usage_ia
    profils: [P1a, P1b, P2, P3, P4, P5]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM01}
      - {taxonomie: mitre_atlas, version: "v4.9.0", id: AML.T0051}
    facettes:
      - cle: garde_prompt
        libelle: "garde-prompt"
        mode: X
        raison: >-
          Le garde-prompt souverain (Mistral) n'est pas encore appelé et aucun de ses verdicts 
          n'entre dans la chaîne. `FR-193` : orchestrer et attester le contrôle tiers — jamais 
          le construire, ce serait le pare-feu de prompts que nous ne sommes pas.
        substitut: {nom: "Mistral (garde-prompt)", justification: ue}
        gaps: [G-01]
      - cle: attestation
        libelle: "attestation de présence du garde"
        mode: X
        raison: >-
          L'Evidence Pack ne porte aucune section attestant la présence du garde-prompt. 
          `FR-193`.
        gaps: [G-01]

  - id: M-02
    titre: "Injection de prompts indirecte"
    famille: usage_ia
    profils: [P2, P3]
    referentiels:
        # LLM01:2025 couvre explicitement l'injection directe et indirecte
      - {taxonomie: owasp_llm, version: "2025", id: LLM01}
      - {taxonomie: mitre_atlas, version: "v4.9.0", id: AML.T0051}
    facettes:
      - cle: taint
        libelle: "garde de taint sur les résultats d'outils"
        mode: B
        ingress: [mcp]
        gaps: [G-02, G-03]

  - id: M-03
    titre: "Empoisonnement de données"
    famille: usage_ia
    profils: [P2, P5]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM04}
    facettes:
      - cle: provenance
        libelle: "déclaration de provenance des jeux de données"
        mode: A
        # `FR-184`, livré au rang 7 : la section existait déjà dans l'Evidence Pack et
        # rien ne la reliait à la revendication. C'est précisément ce que la
        # généralisation de `CM-7` rend impossible.
        section: article_26_deployer.corpus_provenance
        gaps: [G-04]

  - id: M-04
    titre: "Vol de modèle / extraction"
    famille: fournisseur
    profils: [P4, P5]
    referentiels:
        # LLM10:2025 « Unbounded Consumption » absorbe l'extraction de modèle, qui 
        #   était LLM10:2023 « Model Theft » — d'où le millésime obligatoire
      - {taxonomie: owasp_llm, version: "2025", id: LLM10}
    facettes:
      - cle: telemetrie
        libelle: "télémétrie de volume et de motif"
        mode: X
        raison: >-
          La télémétrie de volume existe (`usage_events`) mais elle est cadrée équité et coût, 
          jamais anti-extraction : aucun seuil, aucun verdict, aucune entrée chaînée. 
          `FR-187`, profil P4, hors de ce lot.
        gaps: [G-05]

  - id: M-05
    titre: "Attaques par évasion (adversarial)"
    famille: fournisseur
    profils: [P5]
    facettes:
      - cle: robustesse
        libelle: "robustesse du modèle"
        mode: X
        raison: >-
          Robustesse adversariale du modèle : c'est le travail de l'éditeur qui l'entraîne, pas de la passerelle qui l'appelle.

  - id: M-06
    titre: "Piratage d'agents autonomes"
    famille: usage_ia
    profils: [P3]
    referentiels:
        # un agent détourné agit au-delà de son mandat : c'est « Excessive Agency »
      - {taxonomie: owasp_llm, version: "2025", id: LLM06}
    facettes:
      - cle: chaine
        libelle: "chaîne de contrôle complète, plancher irréversible"
        mode: B
        ingress: [mcp]
        gaps: [G-06]

  - id: M-07
    titre: "Phishing hyper-personnalisé"
    famille: cyber_classique
    profils: [P1a, P1b, P2, P3, P4, P5]
    facettes:
      - cle: emission
        libelle: "l'agent comme émetteur — envoi hors allowlist"
        famille: usage_ia
        profils: [P3]
        mode: B
        ingress: [mcp]
      - cle: reception
        libelle: "réception — passerelle mail"
        profils: [P1a, P1b, P2, P3, P4, P5]
        mode: X
        raison: >-
          Réception du phishing : passerelle de messagerie et EDR du client. Nous couvrons l'agent comme *émetteur*, pas comme destinataire.

  - id: M-08
    titre: "Usurpation par deepfake"
    famille: cyber_classique
    profils: [P1a, P1b, P2, P3, P4, P5]
    facettes:
      - cle: approbation
        libelle: "intégrité de l'approbation — séparation des devoirs"
        famille: usage_ia
        profils: [P3]
        mode: B
        ingress: [mcp]
        gaps: [G-07]
      - cle: media
        libelle: "détection du média truqué"
        profils: [P1a, P1b, P2, P3, P4, P5]
        mode: X
        raison: >-
          Détection de média synthétique : ni notre métier ni notre point d'interposition. Nous couvrons l'intégrité de l'approbation, pas l'authenticité du média.

  - id: M-09
    titre: "Malwares polymorphes"
    famille: cyber_classique
    profils: [P1a, P1b, P2, P3, P4, P5]
    facettes:
      - cle: endpoint
        libelle: "plan endpoint (EDR/XDR)"
        mode: X
        raison: >-
          Plan endpoint et poste de travail : SOC du client. Une passerelle d'actions ne voit pas le poste.

  - id: M-10
    titre: "Exfiltration de données / PI via LLM"
    famille: usage_ia
    profils: [P1a, P1b, P2, P3, P4, P5]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM02}
    facettes:
      - cle: egress
        libelle: "DLP d'egress sur le chemin supervisé"
        mode: B
        ingress: [llm_proxy]
        gaps: [G-08, G-22]
      # Aucun substitut souverain : la découverte du Shadow AI passe par un CASB du
      # marché, et il n'en existe pas dont la décision reste dans le périmètre. La
      # facette est donc déclassée en `Hors périmètre` par FR-178 -- on retire la
      # revendication plutôt que de la tenir par un chemin qui contredit le discours.
      # FR-185 / G-08 : la DLP entre dans la décision *post-taint*. Facette distincte
      # de `egress` — celle-ci porte sur le chemin MCP et sur les arguments d'une
      # action, pas sur le scan du prompt sortant du proxy. Les confondre publierait
      # une preuve MCP sous une revendication `llm_proxy`.
      - cle: post_taint
        libelle: "cible d'exfiltration dans les arguments d'une action post-taint"
        mode: B
        ingress: [mcp]
        gaps: [G-08]

      - cle: decouverte
        libelle: "découverte du Shadow AI non supervisé"
        mode: O
        gaps: [G-09]

  - id: M-11
    titre: "Supply chain (modèles / bibliothèques)"
    famille: usage_ia
    profils: [P2, P3, P4]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM03}
    facettes:
      - cle: outils_mcp
        libelle: "empreinte et quarantaine des outils MCP"
        profils: [P3]
        mode: B
        ingress: [mcp]
      - cle: bibliotheques
        libelle: "SBOM et audit de dépendances en CI"
        profils: [P2, P3, P4]
        mode: A
        section: article_26_deployer.third_party_verdicts

      - cle: modeles_ml
        libelle: "analyse d'artefacts de modèles"
        profils: [P4]
        mode: X
        raison: >-
          Aucun scanner d'artefacts n'est piloté et aucun de ses verdicts n'est chaîné. 
          `FR-188`, profil P4, hors de ce lot.
        substitut: {nom: "picklescan / modelscan", justification: local}
        gaps: [G-10]

  - id: M-12
    titre: "Privilèges excessifs (excessive agency)"
    famille: usage_ia
    profils: [P3]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM06}
    facettes:
      - cle: rbac
        libelle: "RBAC par outil, garde du député confus"
        mode: B
        ingress: [mcp]
        gaps: [G-11, G-24]

  - id: M-13
    titre: "Traitement non sécurisé des sorties"
    famille: usage_ia
    profils: [P3]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM05}
    facettes:
      - cle: charge_executable
        libelle: "détection de charge exécutable dans les résultats"
        mode: D
        gaps: [G-12]

  - id: M-14
    titre: "Fuite du system prompt & secrets"
    famille: usage_ia
    profils: [P1a, P1b, P2, P3, P4, P5]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM07}
    facettes:
      - cle: secrets
        libelle: "coffre ; aucun secret inline, aucun secret journalisé"
        mode: B
        ingress: [mcp, http]
        gaps: [G-13]
      - cle: prompt
        libelle: "détection de fuite du prompt sur l'egress"
        mode: X
        raison: >-
          La fuite de prompt système sur l'egress n'est pas mesurée : les deux moitiés sont en 
          main dans le proxy, rien ne les met en face l'une de l'autre. `FR-190`.
        substitut: {nom: "Mistral (garde de sortie anti-leak)", justification: ue}
        gaps: [G-13]

  - id: M-15
    titre: "Validation aveugle de code (Copilot)"
    famille: usage_ia
    profils: [P1a, P1b]
    referentiels:
        # LLM09:2025 « Misinformation » nomme la génération de code non sûr
      - {taxonomie: owasp_llm, version: "2025", id: LLM09}
    facettes:
      - cle: sast
        libelle: "ingestion de verdicts SAST/DAST"
        mode: O
        substitut: {nom: "SonarQube / Semgrep en CI", justification: local}
        gaps: [G-14]
      - cle: ci
        libelle: "audit de dépendances et de secrets en CI"
        mode: A
        section: article_26_deployer.third_party_verdicts

  - id: M-16
    titre: "Décision fondée sur une hallucination"
    famille: usage_ia
    profils: [P1a, P1b, P2, P3, P4, P5]
    referentiels:
      - {taxonomie: owasp_llm, version: "2025", id: LLM09}
    facettes:
      - cle: revue_humaine
        libelle: "attestation « décision critique sous revue humaine »"
        mode: A
        # `FR-192`. La section porte sa propre limite : elle atteste qu'un humain a
        # regardé, pas que sa conclusion était bonne (non-objectif « pas une
        # plateforme d'évaluation de modèle »).
        section: article_14_human_oversight.critical_decision_review
        gaps: [G-15]
