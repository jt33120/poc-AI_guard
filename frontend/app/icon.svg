<svg xmlns="http://www.w3.org/2000/svg" viewBox="74.98 34.18 374.18 374.18" width="32" height="32">
  <!--
    Le favicon. Next le sert sur /icon.svg et pose lui meme la balise link rel=icon.

    C'est le logo xSOM, copie exacte de la variante cuivre du site
    (assets/logo/cuivre.svg), celle que xsom.fr sert en favicon (index.html l. 27).
    Deux onglets ouverts cote a cote montrent la meme marque, au trace pres.

    Pourquoi la variante cuivre, quand le reste du produit sert moderne-dark : la barre
    d'onglets suit le theme du systeme. moderne-dark perd sa fleche gris clair sur une
    barre claire, gradient perd sa fleche graphite sur une barre sombre. Le cuivre a la
    luminance intermediaire qui tient des deux cotes, verifie en rendu reel a 32 px par
    le site (assets/logo/README.md). C'est le raisonnement du site, repris tel quel.

    Ni fond opaque ni boite : le signe est detoure, comme sur le site, qui ne met jamais
    son logo dans une boite (globals.css, bloc de marque). La tenue sur les deux themes
    vient de la teinte, pas d'un cadre. Le rayon de la boite precedente valait 5, hors
    de l'echelle de rayons de la charte, qui va par 3, 4 et 6.

    width et height ne touchent pas au dessin : ils donnent au fichier une taille
    intrinseque, sans quoi un navigateur qui le charge par new Image() peut rapporter
    une largeur nulle, ce que le smoke Playwright verifie.

    La geometrie est celle de public/xsom-mark.svg, la meme marque servie dans la page.
    Un fichier statique ne peut rien importer, donc c'est une copie ; ce qui l'empeche
    de deriver est tests/test_brand_mark.py, qui compare les deux geometries.

    Ce commentaire est sans accents ni double tiret : un SVG est du XML, ou la sequence
    de deux tirets est interdite dans un commentaire.
  -->
