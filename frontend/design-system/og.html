<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>xSOM Signal · social cover</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--signal-bg);
        color: var(--signal-text);
        font-family: var(--signal-font-body);
      }
      main {
        height: 100vh;
        box-sizing: border-box;
        padding: var(--sp-16);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        display: flex;
        align-items: center;
        gap: var(--sp-4);
        font: 600 var(--fs-h3) var(--signal-font-display);
      }
      header img {
        width: var(--sp-12);
        height: var(--sp-12);
      }
      header span:last-child {
        margin-left: auto;
        color: var(--signal-faint);
        font: 500 var(--fs-label) var(--signal-font-mono);
        letter-spacing: var(--signal-tracking);
      }
      h1 {
        font: 600 var(--fs-h1) / var(--signal-heading-leading)
          var(--signal-font-display);
        letter-spacing: var(--signal-display-tracking);
        max-width: 20ch;
        margin: 0;
      }
      h1 em {
        font-style: normal;
        color: var(--signal-accent-text);
      }
      footer {
        display: flex;
        justify-content: space-between;
        border-top: var(--signal-border) solid var(--signal-line);
        padding-top: var(--sp-6);
        font: 500 var(--fs-xs) var(--signal-font-mono);
        color: var(--signal-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/mark.svg" alt="" /><strong>xSOM / Consulting</strong
        ><span>FRANCE · USA / DEPUIS 2007</span>
      </header>
      <h1>Le conseil qui tient<br />jusqu’à la <em>production.</em></h1>
      <footer>
        <span>TÉLÉCOM & CYBERSÉCURITÉ · IA & CLOUD · DATA</span
        ><span>XSOM.FR ↗</span>
      </footer>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("lang") === "en") {
        document.documentElement.lang = "en";
        document.querySelector("header span").textContent =
          "FRANCE · USA / SINCE 2007";
        document.querySelector("h1").innerHTML =
          "Advice that holds.<br>Through to <em>production.</em>";
        document.querySelector("footer span").textContent =
          "TELECOM & CYBERSECURITY · AI & CLOUD · DATA";
      }
    </script>
  </body>
</html>
