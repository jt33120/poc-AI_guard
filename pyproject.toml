[project]
name = "xsom-ai-guard"
version = "0.1.0"
description = "xSOM AI Guard — MCP action-control gateway for AI agents (MVP)"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are added milestone by milestone (CLAUDE.md §3/§5/§6: strict necessity).
# M0 scope only — auth/policy/judge deps land in M1/M3/M6.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.2",
    "sentry-sdk>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff (lint + format) — CLAUDE.md §3/§5
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "S",       # flake8-bandit (security)
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are expected in tests

# ---------------------------------------------------------------------------
# mypy (strict typing) — CLAUDE.md §5
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
show_error_codes = true

# ---------------------------------------------------------------------------
# pytest + coverage — CLAUDE.md §7 (≥70% on business logic; hard gate from M3)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=core --cov=api --cov=gateway --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
