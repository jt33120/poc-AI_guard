[project]
name = "xsom-ai-guard"
version = "0.1.0"
description = "xSOM AI Guard — MCP action-control gateway for AI agents (MVP)"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are added milestone by milestone (CLAUDE.md §3/§5/§6: strict necessity).
# M0 scope only — auth/policy/judge deps land in M1/M3/M6.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "mcp>=1.28.1",
    "sentry-sdk>=2.0",
    "python-jose[cryptography]>=3.5.0",
    "psycopg[binary]>=3.3.4",
    "httpx>=0.28.1",
    "fpdf2>=2.8.7",
    "litellm>=1.89.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "types-python-jose>=3.5.0.20260408",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff (lint + format) — CLAUDE.md §3/§5
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored AI-agent tooling (Graft, BMAD-METHOD) — third-party scripts we don't
# own or style-check; `.claude/skills/graft` and `graft/` ship no Python.
extend-exclude = ["_bmad", ".claude/skills/bmad-*"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "S",       # flake8-bandit (security)
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# asserts + fake secrets are expected in tests; subprocess drives the PG cluster.
"tests/**" = ["S101", "S603", "S607", "S105", "S106", "S107"]
# S608: queries interpolate only trusted column-name constants / fixed WHERE
# clauses; every dynamic value is a bound parameter (%s) — no injection surface.
"core/approvals.py" = ["S608"]
"core/audit.py" = ["S608"]
"core/tenant_tokens.py" = ["S608"]
"core/read_tokens.py" = ["S608"]
"core/usage.py" = ["S608"]
"core/ai_summary.py" = ["S608"]
"core/agents.py" = ["S608"]
"core/credentials.py" = ["S608"]
"core/billing.py" = ["S608"]
"core/clients.py" = ["S608"]
"core/monitor.py" = ["S608"]
"core/taint_store.py" = ["S608"]
"core/promotion.py" = ["S608"]
"core/corpora.py" = ["S608"]
# RUF001/2/3 flag characters that look like Latin ones. The homoglyph table is
# made of exactly those characters, on purpose: folding them is how a Cyrillic
# "о" in an injected instruction stops evading the pattern (FR-153).
"gateway/taint.py" = ["RUF001", "RUF002", "RUF003"]
# Same reason, one level up: these tests assert that a Cyrillic "о" and a
# full-width "Ｉ" no longer evade the guard, so they must contain them.
"tests/test_taint.py" = ["RUF001", "RUF002", "RUF003"]
# RUF001: the generated map is a published French document — "Applicabilité ×
# couverture" wants the multiplication sign, not the letter x. Nothing here is
# parsed; these strings are rendered to Markdown.
"scripts/gen_coverage.py" = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends/Security in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

# ---------------------------------------------------------------------------
# mypy (strict typing) — CLAUDE.md §5
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
show_error_codes = true

# Third-party libraries without type stubs.
[[tool.mypy.overrides]]
module = ["litellm.*", "slowapi.*", "boto3.*"]
ignore_missing_imports = true

# Test/demo PG harness is followed by scripts/demo.py but not type-gated.
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest + coverage — CLAUDE.md §7 (≥70% on business logic; hard gate from M3)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=core --cov=api --cov=gateway --cov=cli --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
