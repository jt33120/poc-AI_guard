# Publication de l'extension Secret Guard.
#
# Deux canaux, un seul artefact. Le VSIX attaché à la release GitHub est
# téléchargeable sans compte et alimente le bouton de `/extension` ; la Place de
# marché VS Code, elle, donne l'installation en un clic et les mises à jour
# automatiques. Le second exige un jeton d'éditeur que le dépôt ne porte pas : la
# publication est donc conditionnée à la présence de `VSCE_PAT` plutôt que
# supposée, et son absence n'échoue pas la release.
#
# Deux déclenchements, un seul chemin. Une étiquette poussée publie la version
# qu'elle nomme ; le lancement manuel publie la version qu'on lui donne et crée
# l'étiquette au passage. Si la release existe déjà, le lancement manuel reprend
# son VSIX pour publier sur la Place de marché après ajout du jeton éditeur.
name: Secret Guard release

on:
  push:
    tags: ["secret-guard-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, telle qu'elle est écrite dans le manifeste (ex. 0.2.0)"
        required: true
        type: string

# Jeton au plus juste (CLAUDE.md §4) : la release a besoin d'écrire, rien d'autre.
permissions:
  contents: read

concurrency:
  group: secret-guard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify · VSIX · release · marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: secret-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: secret-guard/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      # Une étiquette qui ne dit pas la version du manifeste publierait `0.2.0`
      # sous le nom `0.3.0`, et personne ne s'en apercevrait avant l'installation.
      # Le contrôle vaut pour les deux déclenchements : une saisie manuelle se trompe
      # aussi bien qu'une étiquette.
      - name: Resolve the version to publish, and check it against the manifest
        id: version
        env:
          SAISIE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${SAISIE:-}" ]; then
            etiquette="secret-guard-v${SAISIE}"
          else
            etiquette="$GITHUB_REF_NAME"
          fi
          manifeste="$(node -p "require('./packages/vscode/package.json').version")"
          if [ "${etiquette#secret-guard-v}" != "$manifeste" ]; then
            echo "version demandée $etiquette != manifeste $manifeste" >&2
            exit 1
          fi
          echo "tag=$etiquette" >> "$GITHUB_OUTPUT"

      - name: Static checks, unit coverage, hook contracts, VSIX and latency
        run: xvfb-run -a npm run verify

      - name: Detect Marketplace credentials
        id: credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${VSCE_PAT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VSCE_PAT absent : le VSIX est publié en release, pas sur la Place de marché."
          fi

      - name: Attach the VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          vsix="packages/vscode/dist/xsom-secret-guard-vscode.vsix"
          if gh release view "$ETIQUETTE" >/dev/null 2>&1; then
            gh release download "$ETIQUETTE" \
              --pattern xsom-secret-guard-vscode.vsix \
              --dir packages/vscode/dist \
              --clobber
            node scripts/inspect-vsix.mjs
            echo "::notice::VSIX de la release existante réutilisé pour la Place de marché."
            exit 0
          fi
          empreinte="$(sha256sum "$vsix" | cut -d' ' -f1)"
          # Les notes sont écrites ligne par ligne plutôt qu'en littéral multiligne :
          # dans un bloc YAML, une ligne revenue en colonne 1 ferme le bloc, et une
          # ligne indentée pour y rester deviendrait du code dans le Markdown rendu.
          printf '%s\n' \
            "Protection locale des prompts pour VS Code et Copilot, Claude Code, Codex et Windsurf." \
            "" \
            "Installation : \`code --install-extension xsom-secret-guard-vscode.vsix\`, ou, dans VS Code, le panneau Extensions puis « Installer à partir d'un VSIX »." \
            "" \
            "Puis, une fois : « Secret Guard: Activer la protection automatique »." \
            "" \
            "sha256 \`$empreinte\`" \
            "" \
            "Détection locale et déterministe. Aucune télémétrie, aucun candidat vérifié en ligne." \
            > notes.md
          # Le nom de l'asset est stable d'une version à l'autre : c'est ce qui
          # rend `/releases/latest/download/...` utilisable comme lien permanent.
          # `--target` ne sert qu'au lancement manuel : il crée l'étiquette sur le
          # commit courant. Sur une étiquette déjà poussée, il est sans effet.
          gh release create "$ETIQUETTE" "$vsix" \
            --target "$GITHUB_SHA" \
            --title "Secret Guard ${ETIQUETTE#secret-guard-v}" \
            --notes-file notes.md

      # Republier une version déjà en ligne échoue, et c'est la bonne issue : on ne
      # remplace pas une version publiée, on en publie une nouvelle.
      - name: Publish to the VS Code Marketplace
        if: steps.credentials.outputs.present == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          npx --no-install vsce publish \
            --no-dependencies \
            --packagePath packages/vscode/dist/xsom-secret-guard-vscode.vsix
