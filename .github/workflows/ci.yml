name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege default token (CLAUDE.md §4).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint · types · tests · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries (ephemeral test cluster)
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy core api gateway scripts cli

      - name: Pytest
        run: uv run pytest

      - name: Coverage claims are backed by scenarios (CM-7)
        run: uv run python scripts/gen_coverage.py --check

      - name: Decision path is offline-capable (AD-25 / SM-15)
        run: uv run python scripts/audit_sovereignty.py

      - name: Static security audit
        run: uv run python scripts/audit_security.py

      - name: Dependency vulnerability audit (pip-audit)
        # ecdsa PYSEC-2026-1325 (timing side-channel) has no fixed release and is a
        # transitive dep of python-jose (needed for ES256 JWT verification). Ignored
        # explicitly until an upstream fix ships; every other advisory must still fail.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-1325

  secrets:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  frontend:
    name: frontend (eslint · tsc · playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npm run test:e2e
