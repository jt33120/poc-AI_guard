name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege default token (CLAUDE.md §4).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint · types · tests · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure PostgreSQL server binaries (ephemeral test cluster)
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy core api gateway scripts cli

      - name: Pytest
        run: uv run pytest

      - name: Coverage claims are backed by scenarios (CM-7)
        run: uv run python scripts/gen_coverage.py --check

      - name: Front threat rows match the published map (L3)
        run: uv run python scripts/gen_threat_rows.py --check

      - name: Marketing copy claims nothing the map does not prove (L4)
        run: uv run python scripts/gen_marketing.py --check

      - name: Every replayable row has its recorded sequence (L6)
        run: uv run python scripts/gen_replays.py --check

      - name: The public demo snapshot is a real reading (L8)
        run: uv run python scripts/gen_demo.py --check

      - name: Per-call cost registry is unchanged (EXH-9)
        run: uv run python scripts/measure_overhead.py --check

      - name: Decision path is offline-capable (AD-25 / SM-15)
        run: uv run python scripts/audit_sovereignty.py

      - name: Static security audit
        run: uv run python scripts/audit_security.py

      - name: Dependency vulnerability audit (pip-audit)
        # ecdsa PYSEC-2026-1325 (timing side-channel) has no fixed release and is a
        # transitive dep of python-jose (needed for ES256 JWT verification). Ignored
        # explicitly until an upstream fix ships; every other advisory must still fail.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-1325

  secrets:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified

  frontend:
    name: frontend (eslint · tsc · playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npm run test:e2e

  secret-guard:
    name: secret guard (lint · unit · hook · VSIX · latency)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: secret-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: secret-guard/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Static checks, unit coverage, hook contracts, VSIX and latency
        run: xvfb-run -a npm run verify
