name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege default token (CLAUDE.md §4).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint · types · tests · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy core api gateway scripts

      - name: Pytest
        run: uv run pytest

      - name: Static security audit
        run: uv run python scripts/audit_security.py

      - name: Dependency vulnerability audit (pip-audit)
        run: uv run pip-audit

  secrets:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
