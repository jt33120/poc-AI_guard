name: keep-warm

# Pings the control API so the hosted backend never goes cold — a cold start can
# otherwise add up to a minute to the first request after a quiet period.
# Scheduled workflows only run on the default branch.
on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min (GitHub may delay under load)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping control API health
        run: |
          # No default host: this workflow ships in every fork and clone, and a
          # baked-in URL would point every deployer's CI at someone else's
          # instance. Set the repository variable KEEPWARM_URL to opt in.
          url="${KEEPWARM_URL}"
          if [ -z "$url" ]; then
            echo "KEEPWARM_URL is not set — nothing to keep warm, skipping."
            echo "Set it under Settings → Secrets and variables → Actions → Variables,"
            echo "e.g. https://<your-backend-host>/health"
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 75 "$url") || code=000
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "backend did not return 200"; exit 1
        env:
          KEEPWARM_URL: ${{ vars.KEEPWARM_URL }}
