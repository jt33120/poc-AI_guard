name: keep-warm

# Pings the control API so the hosted backend never goes cold — a cold start can
# otherwise add up to a minute to the first request after a quiet period.
# Scheduled workflows only run on the default branch.
on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min (GitHub may delay under load)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping control API health
        run: |
          url="${KEEPWARM_URL:-https://xsom-ai-guard-production.up.railway.app/health}"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 75 "$url") || code=000
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "backend did not return 200"; exit 1
        env:
          KEEPWARM_URL: ${{ vars.KEEPWARM_URL }}
